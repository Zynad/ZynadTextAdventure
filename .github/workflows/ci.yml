name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - '**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Restore dependencies
        run: dotnet restore TextAdventure.sln

      - name: Build
        run: dotnet build TextAdventure.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test TextAdventure.sln --configuration Release --no-build --logger "trx;LogFileName=test_results.trx"
        env:
          DOTNET_ENVIRONMENT: Test
